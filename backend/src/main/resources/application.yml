spring:
  application:
    name: inventario-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:inventario_db}
    username: ${DB_USER:inventario_user}
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
jwt:
  secret: ${JWT_SECRET:restricted mode is intended for safe code browsing}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

server:
  port: 8080
 

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: DEBUG
